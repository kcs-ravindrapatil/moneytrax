name: conveygrid_moneytracker
description: MoneyTrax — a local-only daily expense tracker.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  auto_route: ^11.2.0
  get_it: ^9.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  json_annotation: ^4.9.0
  intl: ^0.20.3
  shared_preferences: ^2.3.3
  uuid: ^4.5.1
  google_fonts: ^8.2.1
  fl_chart: ^1.2.0
  pdf: ^3.11.1
  share_plus: ^12.0.2
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
#  conveygrid_flutter_sdk:
#    path: ../conveygrid/luxestay_conveygrid_flutter/packages/conveygrid_flutter_sdk
  # Production alternative:
  conveygrid_flutter_sdk:
     git:
       url: https://github.com/conveygrid-sdk/conveygrid-flutter-sdk.git
       ref: v0.1.0
  collection: ^1.19.0
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  auto_route_generator: ^10.6.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/images/onboarding/
    - assets/images/empty/
